# Include inside the existing chatshelf.naruhodoowl.me server { } block
# (the one certbot already configured). Leave location / on the static site.
#
#     include /etc/nginx/snippets/chatshelf-api.conf;
#
# Combined access logs record the request URI, not the body. Do not add a
# log format that prints $request_body. License keys are JSON fields.

location /api/licenses/ {
    proxy_pass http://127.0.0.1:8787;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Origin $http_origin;
    proxy_set_header x-api-key "";
    proxy_hide_header x-api-key;
    proxy_connect_timeout 5s;
    proxy_read_timeout 20s;
    proxy_send_timeout 20s;
    client_max_body_size 8k;
    proxy_redirect off;
}
